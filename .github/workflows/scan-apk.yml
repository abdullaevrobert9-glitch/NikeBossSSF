name: Scan and fix APK

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "Путь к APK в репозитории, например incoming/app.apk"
        required: true
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install apktool
        run: |
          mkdir -p "$HOME/bin"
          curl -L -o "$HOME/bin/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          printf '#!/bin/sh\nexec java -jar "%s/bin/apktool.jar" "$@"\n' "$HOME" > "$HOME/bin/apktool"
          chmod +x "$HOME/bin/apktool"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Add Android build-tools (zipalign, apksigner)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "$BT" >> "$GITHUB_PATH"

      - name: Scan and fix
        run: |
          mkdir -p result
          set -o pipefail; python3 apk_scan.py "${{ inputs.apk_path }}" 2>&1 | tee result/report.txt
          cp "$(dirname "${{ inputs.apk_path }}")"/*_patched.apk result/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: result/
